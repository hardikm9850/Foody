#Mon Jan 12 15:07:01 IST 2026
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Enables Gradle configuration caching
org.gradle.configuration-cache=true
# Warn if build cannot be cached
org.gradle.configuration-cache.verification=true
# Enable local and remote caching
org.gradle.caching=true
org.gradle.caching.debug=true
# Parallel module builds
org.gradle.parallel=true
# Kotlin incremental compilation
kotlin.incremental=true
# Compose compiler optimizations
kotlin.compiler.execution.strategy=in-process
kotlin.compose.enableBuildCache=true
# Gradle daemon for faster repeated builds
org.gradle.daemon=true
# Let Gradle auto-manage workers
org.gradle.workers.max=4

